<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maafin aku ya 🥺</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap">
<style>
:root{
  --bg1:#ffe3ea; --bg2:#ffc9d6; --ink:#5a1f33; --yes:#e8456b; --yes-ink:#fff;
  --no:#fff; --no-ink:#7a3a4e; --card:#fff7f9;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:#2a1220; --bg2:#4a1c34; --ink:#ffe3ea; --yes:#ff6b8f; --yes-ink:#2a0f1b;
    --no:#3d2030; --no-ink:#ffd0dc; --card:#341828;
  }
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:"Fredoka","Trebuchet MS",system-ui,sans-serif; color:var(--ink);
  background:linear-gradient(160deg,var(--bg1),var(--bg2)); overflow:hidden;
  display:flex; align-items:center; justify-content:center;
}
.card{
  width:min(92vw,440px); background:var(--card); border-radius:28px; padding:28px 24px 32px;
  text-align:center; position:relative; z-index:2; box-shadow:0 18px 40px rgba(232,69,107,.22);
}
h1{font-size:1.7rem; line-height:1.25; margin:.4em 0 .3em; font-weight:600}
p{font-size:1.05rem; line-height:1.5; margin:.2em 0 1.2em}
.cat{width:170px; height:auto; display:block; margin:0 auto}
.btns{display:flex; gap:14px; justify-content:center; align-items:center; min-height:60px; flex-wrap:wrap}
button{
  font:inherit; font-weight:600; font-size:1.15rem; border:0; border-radius:999px;
  padding:14px 30px; cursor:pointer; touch-action:manipulation;
}
button:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
#yes{background:var(--yes); color:var(--yes-ink); transition:transform .2s}
#no{background:var(--no); color:var(--no-ink); box-shadow:0 4px 12px rgba(0,0,0,.12); transition:left .25s ease, top .25s ease}
#no.run{position:fixed; z-index:5}
#hint{min-height:1.4em; font-size:.95rem; opacity:.85; margin-top:14px}
a.send{display:inline-block; margin:6px 0 14px; padding:14px 26px; border-radius:999px; background:var(--yes); color:var(--yes-ink); font-weight:600; font-size:1.1rem; text-decoration:none}
a.send:focus-visible{outline:3px solid var(--ink); outline-offset:3px}
#done{display:none}
#done.show{display:block; animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6); opacity:0}to{transform:scale(1); opacity:1}}
.bob{animation:bob 1.6s ease-in-out infinite; cursor:pointer}
@keyframes bob{50%{transform:translateY(-8px) rotate(-2deg)}}
.heart{position:fixed; bottom:-40px; z-index:1; pointer-events:none; animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-115vh) rotate(var(--r,20deg)); opacity:0}}
@media (prefers-reduced-motion:reduce){.bob{animation:none} .heart{animation-duration:3s!important}}
</style>
</head>
<body>
<main class="card">
  <section id="ask">
    <svg class="cat" viewBox="0 0 200 180" role="img" aria-label="Kucing sedih">
      <ellipse cx="100" cy="150" rx="54" ry="26" fill="#f6b26b"/>
      <path d="M52 62 L58 22 L88 46 Z M148 62 L142 22 L112 46 Z" fill="#f6b26b"/>
      <path d="M60 52 L62 34 L78 46 Z M140 52 L138 34 L122 46 Z" fill="#ffb3c4"/>
      <circle cx="100" cy="90" r="52" fill="#f6b26b"/>
      <ellipse cx="82" cy="88" rx="7" ry="9" fill="#3b1f2b"/><ellipse cx="118" cy="88" rx="7" ry="9" fill="#3b1f2b"/>
      <circle cx="84" cy="85" r="2.6" fill="#fff"/><circle cx="120" cy="85" r="2.6" fill="#fff"/>
      <path d="M72 76 Q82 70 90 76 M110 76 Q118 70 128 76" stroke="#3b1f2b" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M94 104 L106 104 L100 111 Z" fill="#e8456b"/>
      <path d="M92 120 Q100 114 108 120" stroke="#3b1f2b" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M62 102 L30 96 M62 110 L30 114 M138 102 L170 96 M138 110 L170 114" stroke="#3b1f2b" stroke-width="2" stroke-linecap="round"/>
      <path d="M96 128 q-3 8 0 14 q3 -6 0 -14" fill="#7ec8ff"/>
    </svg>
    <h1 id="title"></h1>
    <p>Aku tahu aku nyebelin. Maafin aku ya?</p>
    <div class="btns" id="btns">
      <button id="yes" type="button">Iya</button>
      <button id="no" type="button">Tidak</button>
    </div>
    <div id="hint" aria-live="polite"></div>
  </section>

  <section id="done">
    <svg class="cat bob" id="happy" viewBox="0 0 200 180" role="img" aria-label="Kucing senang, klik untuk hati">
      <ellipse cx="100" cy="150" rx="54" ry="26" fill="#f6b26b"/>
      <path d="M52 62 L58 22 L88 46 Z M148 62 L142 22 L112 46 Z" fill="#f6b26b"/>
      <path d="M60 52 L62 34 L78 46 Z M140 52 L138 34 L122 46 Z" fill="#ffb3c4"/>
      <circle cx="100" cy="90" r="52" fill="#f6b26b"/>
      <path d="M72 90 Q82 76 92 90 M108 90 Q118 76 128 90" stroke="#3b1f2b" stroke-width="4" fill="none" stroke-linecap="round"/>
      <ellipse cx="70" cy="104" rx="9" ry="5" fill="#ff8fa8" opacity=".7"/><ellipse cx="130" cy="104" rx="9" ry="5" fill="#ff8fa8" opacity=".7"/>
      <path d="M94 102 L106 102 L100 109 Z" fill="#e8456b"/>
      <path d="M90 114 Q100 126 110 114 Z" fill="#c2334f" stroke="#3b1f2b" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M62 102 L30 96 M62 110 L30 114 M138 102 L170 96 M138 110 L170 114" stroke="#3b1f2b" stroke-width="2" stroke-linecap="round"/>
      <path d="M100 160 c-14 -10 -22 -18 -22 -28 a12 12 0 0 1 22 -6 a12 12 0 0 1 22 6 c0 10 -8 18 -22 28z" fill="#e8456b"/>
    </svg>
    <h1>Yeay, dimaafin! 💖</h1>
    <p>Makasih ya sayang. Aku bakal lebih baik lagi. Aku sayang kamu.</p>
    <a id="send" class="send" href="#" target="_blank" rel="noopener">Kirim jawabanku 💌</a>
    <div id="hint2" style="font-size:.9rem;opacity:.8">Pencet kucingnya buat hati lagi</div>
  </section>
</main>

<script>
(function(){
  var NAMA = "Oni Sayang"; // ganti dengan nama atau panggilan pacarmu
  var NOMOR = "6282121460563"; // nomor WhatsApp kamu, format 628123456789 (tanpa + dan spasi)
  var title = document.getElementById("title");
  title.textContent = NAMA + ", aku minta maaf ya 🥺";

  var yes = document.getElementById("yes"), no = document.getElementById("no");
  var hint = document.getElementById("hint");
  var lines = ["Eh, kok kabur?", "Nggak bisa dipencet 😝", "Coba lagi deh…", "Tombol Iya lebih gede lho", "Yakin mau pencet Tidak? 🥺", "Kucingnya sedih nih…", "Udah, pencet Iya aja ya 💕"];
  var n = 0, scale = 1;

  function dodge(e){
    if(e){ e.preventDefault(); e.stopPropagation(); }
    var w = no.offsetWidth, h = no.offsetHeight, pad = 12;
    var maxX = Math.max(pad, window.innerWidth - w - pad);
    var maxY = Math.max(pad, window.innerHeight - h - pad);
    var curX = parseFloat(no.style.left) || 0, curY = parseFloat(no.style.top) || 0;
    var x, y, tries = 0;
    do {
      x = pad + Math.random() * (maxX - pad);
      y = pad + Math.random() * (maxY - pad);
      tries++;
    } while (Math.hypot(x - curX, y - curY) < 120 && tries < 12);
    if(!no.classList.contains("run")){
      var r = no.getBoundingClientRect();
      no.style.left = r.left + "px"; no.style.top = r.top + "px";
      no.classList.add("run");
      void no.offsetWidth;
    }
    no.style.left = x + "px"; no.style.top = y + "px";
    hint.textContent = lines[n % lines.length]; n++;
    scale = Math.min(scale + 0.12, 2.2);
    yes.style.transform = "scale(" + scale + ")";
    yes.style.margin = (scale > 1.3 ? (scale - 1) * 14 : 0) + "px";
  }
  ["pointerenter","pointerdown","touchstart","click","focus"].forEach(function(t){
    no.addEventListener(t, dodge, {passive:false});
  });

  var icons = ["❤️","💖","💕","💗","💘","🩷"];
  function heart(x){
    var s = document.createElement("span");
    s.className = "heart";
    s.textContent = icons[Math.floor(Math.random()*icons.length)];
    s.style.left = (x != null ? x : Math.random()*100) + "vw";
    s.style.fontSize = (18 + Math.random()*30) + "px";
    var d = 3.5 + Math.random()*3;
    s.style.animationDuration = d + "s";
    s.style.setProperty("--r", (Math.random()*60-30) + "deg");
    document.body.appendChild(s);
    setTimeout(function(){ s.remove(); }, d*1000 + 100);
  }
  function burst(count, cx){
    for(var i=0;i<count;i++) setTimeout(function(){ heart(cx != null ? cx + (Math.random()*24-12) : null); }, i*70);
  }

  yes.addEventListener("click", function(){
    document.getElementById("ask").style.display = "none";
    no.style.display = "none";
    document.getElementById("done").classList.add("show");
    var pesan = "Iya, aku maafin kamu 💖" + (n > 0 ? " (aku sempat coba pencet Tidak " + n + " kali 😝)" : "");
    document.getElementById("send").href = "https://wa.me/" + NOMOR + "?text=" + encodeURIComponent(pesan);
    burst(40);
    var t = setInterval(function(){ heart(); }, 220);
    setTimeout(function(){ clearInterval(t); }, 12000);
  });
  document.getElementById("happy").addEventListener("click", function(e){
    burst(18, e.clientX / window.innerWidth * 100);
  });
})();
</script>
</body>
</html>
